<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="768" viewBox="0 0 1024 768" role="img" aria-labelledby="title desc">
  <title id="title">和弦 · Chord — 一起写，也各自从容。</title>
  <desc id="desc">An authored collaboration illustration with fictional participants Lin, Qiao and Yue. Not a screenshot of SiYuan.</desc>
  <rect width="1024" height="768" fill="#f5f2eb"/>
  <g transform="translate(64 56) scale(.5)" fill="none" stroke-linecap="round">
    <path d="M48 47C37 66 37 94 48 113M80 34C66 59 66 101 80 126M112 47C101 66 101 94 112 113" stroke="#234b43" stroke-width="9"/>
    <path d="M44 96C68 91 91 81 115 66" stroke="#976635" stroke-width="7"/>
  </g>
  <text x="163" y="116" fill="#234b43" font-family="Georgia,serif" font-size="70">Chord</text>
  <text x="165" y="155" fill="#52675e" font-family="SimSun,serif" font-size="24" letter-spacing="5">和弦</text>
  <text x="64" y="250" fill="#203e37" font-family="SimSun,serif" font-size="39">一起写，也各自从容。</text>
  <text x="66" y="291" fill="#52675e" font-family="Microsoft YaHei,sans-serif" font-size="18">为同一份笔记，留出彼此的位置。</text>
  <path d="M64 334H960" stroke="#cdd4c8"/>
  <rect x="255" y="388" width="254" height="35" rx="3" fill="#d6e4d9"/>
  <text x="86" y="414" fill="#29473e" font-family="SimSun,serif" font-size="24">春天的目录，留给一起整理的人。</text>
  <g transform="translate(557 404)" fill="#3b7668" stroke="#f5f2eb" stroke-width="1.5">
    <path d="M0 0L19 9L10 12L7 21Z"/>
  </g>
  <text x="586" y="439" fill="#315f54" font-family="Georgia,serif" font-size="18">Lin</text>
  <text x="719" y="457" fill="#79542e" font-family="Microsoft YaHei,sans-serif" font-size="14">Qiao 正在编辑</text>
  <rect x="79" y="468" width="767" height="51" rx="5" fill="#faf6ee" stroke="#c6a27a"/>
  <text x="86" y="501" fill="#29473e" font-family="SimSun,serif" font-size="24">先读一遍，再为这一段补上注脚。</text>
  <text x="86" y="582" fill="#29473e" font-family="SimSun,serif" font-size="24">各自的一步，也可以各自退回。</text>
  <g transform="translate(478 572)" fill="#746593" stroke="#f5f2eb" stroke-width="1.5">
    <path d="M0 0L19 9L10 12L7 21Z"/>
  </g>
  <text x="508" y="609" fill="#66577f" font-family="Georgia,serif" font-size="18">Yue</text>
  <text x="66" y="661" fill="#52675e" font-family="Microsoft YaHei,sans-serif" font-size="16">具名在线 · 指针与选区 · 块编辑锁 · 个人撤销</text>
  <path d="M64 688H960" stroke="#cdd4c8"/>
  <text x="66" y="721" fill="#52675e" font-family="Microsoft YaHei,sans-serif" font-size="13">思源笔记协作插件</text>
  <text x="960" y="721" text-anchor="end" fill="#52675e" font-family="Microsoft YaHei,sans-serif" font-size="13">协作示意 · 非界面截图</text>
